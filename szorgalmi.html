<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Keypad</title>

        <style>
            body {
                background-color: khaki;
                font-size: 80%;
            }

            table, #tartalom, #felirat {
                box-shadow: 2px 2px 3px 0px rgba(0, 0, 0, 0.8);
            }

            table {
                border-spacing: 5px;
            }

            #tartalom {
                background-color: white;
                border-radius: 10px;
                padding: 1px;
                width: fit-content;
            }

            #felirat, #gombok > * {
                margin: 8px;
                border: 2px double blue;
                border-radius: 5px;
                background-color: khaki;
            }

            #felirat {
                background-color: khaki;
                width: auto;
                display: flex;
                margin-bottom: 0px;
                text-align: center;
                justify-content: center;
                align-items: center;
                min-height: 25px;
            }

            #felirat p {
                text-align: center;
                font-size: 90%;
                margin: 0;
            }

            .gomb {
                width: 22px;
                height: 22px;
                vertical-align: middle;
                text-align: center;
                border-radius: 5px;
                box-shadow: 1px 1px 2px 0px rgba(0, 0, 0, 0.8);
            }

            .betug {
                background-color: lightgreen;
            }

            .betug:hover {
                color: green;
                background-color: greenyellow;
                box-shadow: 2px 2px 3px 0px rgba(0, 0, 0, 0.8);
            }

            .keypadg {
                width: 100%;
                background-color: aqua;
            }

            .spaceg {
                background-color: lightblue;
                width: auto;
            }

            .tickg {
                background-color: lightblue;
                height: auto;
            }

            .szamg {
                background-color: coral;
            }

            .szamg:hover {
                color: darkred;
                background-color: red;
                box-shadow: 2px 2px 3px 0px rgba(0, 0, 0, 0.8);
            }

            .vesszog {
                background-color: lightblue;
                width: auto;
            }

            .spaceg:hover, .tickg:hover, .vesszog:hover {
                color: blue;
                background-color: aqua;
                box-shadow: 2px 2px 3px 0px rgba(0, 0, 0, 0.8);
            }
            
        </style>
    </head>

    <body>
        <div id="tartalom">
            <div id="felirat">
                <p>3. dolgozat</p>
            </div>

            <div id="gombok" style="display: flex;">
                <table>
                    <tr>
                        <td class="gomb keypadg" colspan="10">Keypad</td>
                    </tr>

                    <tr>
                        <td class="gomb betug">Q</td>
                        <td class="gomb betug">W</td>
                        <td class="gomb betug">E</td>
                        <td class="gomb betug">R</td>
                        <td class="gomb betug">T</td>
                        <td class="gomb betug">Z</td>
                        <td class="gomb betug">U</td>
                        <td class="gomb betug">I</td>
                        <td class="gomb betug">O</td>
                        <td class="gomb betug">P</td>
                    </tr>
                    
                    <tr>
                        <td class="gomb betug">A</td>
                        <td class="gomb betug">S</td>
                        <td class="gomb betug">D</td>
                        <td class="gomb betug">F</td>
                        <td class="gomb betug">G</td>
                        <td class="gomb betug">H</td>
                        <td class="gomb betug">J</td>
                        <td class="gomb betug">K</td>
                        <td class="gomb betug">L</td>
                        <td rowspan="2" class="gomb tickg">✔️</td>
                    </tr>

                    <tr>
                        <td class="gomb betug">Y</td>
                        <td class="gomb betug">X</td>
                        <td class="gomb betug">C</td>
                        <td class="gomb betug">V</td>
                        <td class="gomb betug">B</td>
                        <td class="gomb betug">N</td>
                        <td class="gomb betug">M</td>
                        <td colspan="2" class="gomb spaceg">____</td>
                    </tr>
                </table>
    
                <table style="margin-left: 0px;">
                    <tr>
                        <td class="gomb szamg">1</td>
                        <td class="gomb szamg">2</td>
                        <td class="gomb szamg">3</td>
                    </tr>
                    
                    <tr>
                        <td class="gomb szamg">4</td>
                        <td class="gomb szamg">5</td>
                        <td class="gomb szamg">6</td>
                    </tr>

                    <tr>
                        <td class="gomb szamg">7</td>
                        <td class="gomb szamg">8</td>
                        <td class="gomb szamg">9</td>
                    </tr>

                    <tr>
                        <td colspan="2" class="gomb vesszog">,</td>
                        <td class="gomb szamg">0</td>
                    </tr>
                </table>
            </div>
        </div>
    </body>
</html>
