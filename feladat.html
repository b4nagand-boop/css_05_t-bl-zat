<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            table{
                background-color: antiquewhite;
                border: 2px solid brown;
            }

            #kulsot {
                border-top-right-radius: 10px;
                border-bottom-left-radius: 10px;
            }

            #belsot th, #belsot td {
                border: 2px solid brown;
            }

            #belsot {
                width: 100%;
            }

            #cim {
                border: 1px solid red;
                background-color: yellow;
                color: red;
                font-weight: bolder;
                text-align: center;
            }

            tbody:nth-child(odd) {
                background-color: grey;
            }
        </style>
    </head>

    <body>
        <table id="kulsot">
            <tr>
                <td>
                    <div style="padding: 10px;">
                        <div id="cim">Férfi vízilabda összesített<br>éremtáblázat, olimpiák</div>
                    </div>
                </td>
            </tr>

            <tr>
                <td>
                    <table id="belsot">
                        <tr>
                            <th>Földrész</th>
                            <th>Országok</th>
                            <th>Arany</th>
                            <th>Ezüst</th>
                            <th>Bronz</th>
                        </tr>

                        <tbody>
                            <tr>
                                <td rowspan="4">Európa</td>
                                <td>1. Magyarország</td>
                                <td>8</td>
                                <td>3</td>
                                <td>3</td>
                            </tr>

                            <tr>
                                <td>2. Nagy-britannia</td>
                                <td>4</td>
                                <td>0</td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td>3. Jugoszlávia</td>
                                <td>3</td>
                                <td>4</td>
                                <td>1</td>
                            </tr>

                            <tr>
                                <td>4. Olaszország</td>
                                <td>3</td>
                                <td>1</td>
                                <td>2</td>
                            </tr>

                            <tr>
                                <td>Ázsia</td>
                                <td>5. Szovjetúnió</td>
                                <td>2</td>
                                <td>2</td>
                                <td>3</td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
